name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run all tests (UI, API, database, end-to-end)
        run: mvn -B test

      - name: Test summary
        if: always()
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && tail -n +4 "$f" | head -n 1 >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/screenshots
          if-no-files-found: ignore
